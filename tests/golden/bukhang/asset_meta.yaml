  - "개요(p7): 준공업지역·제1종지구단위계획구역(북항배후지), 대지 27,351.50㎡, 건축면적 13,437.50㎡, 연면적 111,934.06㎡(창고동, 준공도면) — 사용승인서 111,959.24㎡는 경비실 25.18㎡ 포함 합계(p8). 건폐율 49.22%, 용적률 237.51%, 높이 87m, 지하1층·지상10층, 설계 무영건축. 조경 6,093.55㎡(22.27%), 주차 332대(화물 220·확장 105·장애인 5·EV 2)."
  - "구성(p7, p51-53): 전 층 저온창고 계획 — 창고 8개층(1F, 3F~9F, 층마다 저온창고 3구획 + 작업장), 사무 2개층(2F, 10F 사무·식당), B1 기계·전기·발전기실. 건물 서측 양방향 나선형 차량 램프(7m×2차로, R12.5m)가 각 층 북측 차로(14m)·Berth(13m, 층당 화물 24대)로 연결. 10F 옥상 주차(화물 28대). 경비동은 남측 진입구 별동 1층."
  - "운영 현황(매도인 설명, p51-52): 5층(503호 부분)·9층은 상온창고, 6~8층은 저온창고로 임대·운영. 상온 사용 구간도 유니트쿨러·배관은 존치(p131)."
  - "구조(p94, p100): HyFo 합성보+데크 슬래브 SRC조(1F~지붕) + 철골조, B1 RC조, PHC D600 파일(2,500kN/EA). 설계하중 저온창고·하역장·램프·옥상주차장 25.0kN/㎡, 사무실 4.0kN/㎡(p101). 구조도면·구조설계서는 2021.03 실시설계본(p95)."
  - "냉동(p126-128): NH3(R717)/CO2 캐스케이드, 스크류 CU 8대(3F·7F), 증발식 응축기 400RT×4(옥상). 전기(p134-137, p180): 수전 9,750kVA(TR 7대), 계약전력 9,750kW, 최대수요 약 1,300kW, 발전기 900kW + 2,250kW."
