  SP05:  # 램프·차량 접근 제약
    - {text: "서측 양방향 차량 램프 7m×2차로(14m), 회전반경 R=12.5m. 경사 직선구간 8.68~8.76%, 곡선구간 내측 10.68~10.69%·외측 7.43~7.47%, 시·종점 완화차로 2.81~4.00% — 보고서는 경사·폭에 대한 문제 제기 없음", page: 46, severity_hint: 양호}
    - {text: "램프가 각 층 창고 북측 차로와 연결 — 창고 8개층 모두 차량 직접 접안", page: 41, severity_hint: 양호}
    - {text: "9~10층 오픈 주차램프 구간 스노우멜팅 설비 설치(결빙 사고 예방)", page: 22, severity_hint: 양호}
    - {text: "출구 전용 통로 출차 주의등이 외부 충돌로 기울어짐 — 전도 전 보수 필요. 주차관제설비 위치가 준공 평면도에 미반영", page: 174, severity_hint: 경미}
  SP06:  # 트럭야드 협소
