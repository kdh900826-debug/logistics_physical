  SP02:  # 유효층고 미달
    - {text: "창고 층고 10m. 실측 슬래브 하단 9.132~9.382m, 보 하단 8.482~8.576m, 배관하부 7.852~8.025m, 유닛쿨러 배관하부 6.319~6.451m(1F·기준층) — 보고서는 별도 문제 제기 없음", page: 68, severity_hint: 양호}
    - {text: "향후 메자닌·랙 설치 시 조도 부족·조명기구 간섭 검토 권장", page: 146, severity_hint: 경미}
  SP03:  # 기둥 스팬·랙 효율
    - {text: "창고 구조 모듈 11m × 11m, 층마다 저온창고 3구획 + 작업장, 8개층 동일 평면", page: 52, severity_hint: 양호}
  SP04:  # 도크 부족
