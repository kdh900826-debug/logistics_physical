# 룰별 실사 소견 — 임계값 확인표에서 "이 자산은 실제로 문제가 있었나"를 보여주는 용도
# source_doc: 물리실사_20260605_WonCoda TDD_Report.pdf  (WSP Korea, 2026-06-04 Rev2)
# page = PDF 페이지 (인쇄 쪽번호 'Page n' = PDF p − 1)
# severity_hint: 결함 | 경미 | 양호
# 보고서 Key Findings(p11~p29)는 위험도 색(High/Moderate/Low)을 텍스트로 남기지 않아, 본문 표현('하자보수 필요'·'즉시'·'권장')으로 등급을 매겼다.
findings:
  SP01:  # 바닥하중 미달
