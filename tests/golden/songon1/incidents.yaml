  - id: 2022-05-handover-urethane-crack-liability
    type: 계약
    date: 2022-05-01
    location: 지상1층·지하2층 냉동창고 (인수인계확인서, 2022.05)
    category: 인수인계 조건(전환 시 하자 책임 임대인 귀속)
    cause: 임차인은 냉동창고를 현재 상온으로 사용. 지상1층·지하2층 냉동창고 우레탄 크랙(건축정밀점검 30·35·76번)은 보수 결과를 임차인이 '보류'한 채 현상대로 인수
    damage: "추후 냉동·냉장으로 전환하면서 잔존 크랙의 유지·확장으로 사용 침해가 생기면 임대인이 하자보수 책임을 진다. 임대인의 보수 이행 여부와 관계없이 해당 부위는 임차인의 원상복구 의무 면제"
    handling: 인수인계확인서 제2조 단서로 합의(인계자 코람코제135호, 인수자 임차인)
    prevention: null
    rules: [CL04, CL03]
    severity_hint: 결함
    dd_flagged: yes      # DD p23(지하2층 방열 보수 흔적·우레탄 뿜칠 크랙), p14
    note: 전환 시점의 단열 보수 비용이 임대인 우발채무로 남는다. 2023-07 냉동창고 우레탄폼 크랙 현황 조사(B2 약 20개소, 최대 폭 10cm×길이 200cm)
    source:
      - 01. Punchlist 협의/23. 펀치 최종 협의/1-5_[코람코135호]인수인계합의서v2(1st Draft_0407)_최종.docx
