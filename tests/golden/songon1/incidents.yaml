    type: 공사
    date: 2021-11-18
    location: 지하2층·지상1층 냉동창고 (약 30,613㎡ = B2 18,920.13 + 1F 11,692.97, golden 면적)
    category: 온도대 전환 추가공사(냉동 → 냉장)
    cause: 냉동창고(영하)는 스프링클러·옥내소화전이 면제돼 설치되지 않았는데(DD p46), 냉장창고로 바꾸면서 소방·환기설비를 새로 설치해야 했다
    damage: "공급가액 20.5억원(VAT 포함 22.55억원) — 환기덕트 4.21억, 스프링클러 배관 5.39억, 옥내소화전 배관 2.45억, 소화내진 0.24억, 자동화재탐지 5.85억, 건축전기 0.43억(집계표 직접공사비). 면적당 약 6.7만원/㎡(공급가 ÷ B2·1F 면적, 산출값)"
    handling: 도급사 ㈜우석이엔씨건축사사무소(매도인 측) → 수급사 ㈜서원이에스티, 공기 2021-11-19~2022-12-31, 하자담보 2년·보증금률 3%. 2022-01-03 이천소방서 소방시설 완공검사증명서 발급(구조란 '지하2층 ~ 지상1층 냉동 -> 냉장창고 변경', 스프링클러 헤드 3,487·P/V 10, 옥내소화전 35)
    prevention: null
    rules: [CL04, FR03]
    severity_hint: 결함
    dd_flagged: partial  # DD p6 '냉동↔상온 변경은 범위 제외', p46 '냉동창고 SP·옥내소화전 면제'
    note: 전환 비용은 이 건에서 매도인 측이 부담한 것으로 보인다(도급사가 시행사). 2층은 이와 별개로 골조 후 냉동→상온 변경(DD p19, p48)
    source:
