# 룰별 실사 소견 — 임계값 확인표에서 "이 자산은 실제로 문제가 있었나"를 보여주는 용도
# source_doc: 첨부 2. 211124_이천송온리물류1센터_준공실사(DD)보고서.pdf  (page = PDF 페이지 = 인쇄 쪽번호)
# severity_hint: 결함 | 경미 | 양호
# 필수 학습 항목(사용자 지정): p19 온도대 변경에 따른 바닥 단차, p21 램프→하역장 동선상 기둥으로 40FT 진출입 곤란
findings:
  CL04:  # 온도대 전환 유연성
    - {text: "[필수] 지상2층 창고와 ELEV홀 사이 바닥 단차 — 골조공사 완료 후 냉동창고가 상온창고로 바뀌면서 바닥 마감 두께가 달라져 생김. 운영 불편·보행 안전사고 우려, 경사로 설치 등 조치 필요", page: 19, severity_hint: 결함}
    - {text: "1층 냉동창고 하역장은 최대 5톤 냉동차 기준이라 지금은 문제없으나, 상온창고로 바꿔 대형차를 운용하면 기둥 사이 통과가 어려움", page: 14, severity_hint: 결함}
    - {text: "2층 냉동→상온 변경으로 수전용량 4,000kW → 3,500kW로 감소(냉동냉장 변압기 축소) — 다시 냉동으로 바꾸면 수전 증설 필요", page: 48, severity_hint: 경미}
    - {text: "보고서는 향후 임차인 요청에 따른 냉동↔상온 변경 사항을 범위에서 제외", page: 6, severity_hint: 경미}
  SP05:  # 램프·차량 접근 제약
    - {text: "[필수] 지상2층 램프에서 하역장으로 가는 동선상에 기둥이 있어 40ft 트레일러 등 대형차 진출입 어려움 — 기둥보호대, 운영 시 안내원 배치, 대형차는 3층 상온창고로 유도 등 운영상 조치 필요", page: 21, severity_hint: 결함}
    - {text: "2층 경사로에서 하역장 이동 시 기둥 간섭으로 반대차선 침범, 한 번에 진출입 어려움(결론)", page: 61, severity_hint: 결함}
    - {text: "램프 곡선구간에서 40ft 컨테이너 등 대형차가 반대차선 침범 예상 — 운영상 관리 조치 필요", page: 36, severity_hint: 결함}
    - {text: "램프 구간 사각지대로 하행 차량·하역장 출차 차량 충돌 우려, 주차관제(출차주의등) 시공 누락", page: 54, severity_hint: 경미}
    - {text: "3층→2층 램프 하부 누수로 측면 오픈 트렌치 추가, 아스콘 재시공으로 중앙차선 지워짐", page: 37, severity_hint: 경미}
  SP09:  # 하역 동선 기둥 간섭
    - {text: "[필수] 지상2층 램프→하역장 동선상 기둥 — 40ft 트레일러 등 대형차 진출입 어려움, 반대차선 침범·한 번에 진출입 불가(p61). 기둥보호대·안내원·대형차 3층 유도 필요", page: 21, severity_hint: 결함}
    - {text: "1층 냉동 하역장: 상온 전환 후 대형차 운용 시 기둥 사이 통과 어려움(현재 5톤 냉동차는 문제없음)", page: 14, severity_hint: 경미}
  SP04:  # 도크 부족
    - {text: "냉동창고 하역데크 수동 레벨러·도크씰·방열도어 양호, 오버헤드도어 도면(ADV-200, 캐나다)과 달리 국산 설치·동작 양호", page: 25, severity_hint: 양호}
    - {text: "3층 하역장 캐노피 길이 6m — 우천 시 대형차 하역 어려움, 캐노피 거터 물고임", page: 20, severity_hint: 경미}
  SP01:  # 바닥하중 미달
    - {text: "설계 활하중: 상온·냉동창고 22kN/㎡, 램프·차량데크 25kN/㎡", page: 38, severity_hint: 양호}
  SP02:  # 유효층고 미달
    - {text: "층고 3F 8m, 2F 9.15m — 3단 랙(4단 파렛) 설치 어려움 예상", page: 17, severity_hint: 결함}
    - {text: "냉동창고 층고 1F 8.85m, B2 9.2m — 3단 랙(4단 파렛) 설치 어려움 예상", page: 21, severity_hint: 결함}
  SP03:  # 기둥 스팬·랙 효율
    - {text: "구조 기본 모듈 11m x 11m", page: 39, severity_hint: 양호}
  G01:   # 배관 노후
    - {text: "우수배관 PVC VG1 일부 링조인트(RF) 접합 — 집중호우 수격에 취약, 본드접합 재시공 필요", page: 43, severity_hint: 경미}
    - {text: "지하1층 집수정 펌핑 배관 보온 미적용, 냉동기계실 바닥배수 1개소뿐 — 추가 필요", page: 43, severity_hint: 경미}
  G02:   # 수변전설비 노후
    - {text: "수전 3,500kW 부하계산에 맞게 선정, 적정", page: 48, severity_hint: 양호}
    - {text: "전기실 상부에 냉동창고(방수 미적용) — 결로로 전기실 누수 우려", page: 49, severity_hint: 결함}
    - {text: "증설용 예비공간은 있으나 저압반 Cable Tray 높이 때문에 증설 시 간섭 — 트레이 높이 변경 필요", page: 49, severity_hint: 경미}
  G04:   # 비상발전기 신뢰성
    - {text: "발전기 300kW(비상용)+500kW(냉동냉장용) 2대로 변경 설치, 2021.09.14 시험운전", page: 49, severity_hint: 양호}
    - {text: "발전기실 상부도 냉동창고(방수 미적용) — 결로 누수 우려. 매연저감장치 미설치, 연도 관통부 실리콘 성적서 없음", page: 49, severity_hint: 경미}
  G05:   # 스프링클러·제연 노후
    - {text: "소방시설 2021.09 준공, 전반 양호. 드라이펜던트 길이 교체, 냉동창고 입구구역 헤드·감지기 미설치 보완 필요", page: 46, severity_hint: 경미}
    - {text: "하역장 연기감지기(A·B 방식) 외기 노출로 먼지 오작동 우려 — 불꽃·광센서형으로 변경 검토", page: 56, severity_hint: 경미}
  G06:   # 지붕 방수·배수 열화
    - {text: "지붕 용마루 후레싱 찌그러짐, 피뢰침 지지 와이어 브레이싱이 지붕재에 고정 — 바람에 따라 향후 누수 가능성", page: 16, severity_hint: 경미}
    - {text: "건축물과 램프 사이 신축 조인트 일부 누수(현장 관리자 확인), 램프 단부 누수 보수 중 — 지속 관찰 필요", page: 14, severity_hint: 결함}
  G07:   # 야드·램프 포장 열화
    - {text: "램프 아스콘 포장에 부분 보수 흔적 다수", page: 36, severity_hint: 경미}
    - {text: "1층 북측 주차장·우측 램프 2층 출입구·3층 주차장 물고임 — 절삭·덧씌우기로 노면구배 조정 필요", page: 57, severity_hint: 경미}
    - {text: "우측 램프 1층 출입구·1층 남측 주차장 트렌치~포장 접속부 균열", page: 58, severity_hint: 경미}
    - {text: "주출입구 포함 아스콘·투수블럭·경계석 전반 양호, 하역장 아스콘 마감 양호", page: 58, severity_hint: 양호}
  G09:   # 법규 적합성·용도변경
    - {text: "지하2층 조경이 도면과 달리 일부 삭제 — 이천시 건축조례 조경면적(대지면적 15% 이상) 기준에 부족한 것으로 판단, 확보 여부 확인 필요", page: 35, severity_hint: 결함}
    - {text: "PC+RC 구조계산서와 지붕 철골 구조계산서(구조기술사 2명 날인)의 설계 개요 불일치 — 수정 보완 필요", page: 40, severity_hint: 경미}
    - {text: "주출입구 차단기·부출입구 출입문 미설치 — 보안 취약", page: 35, severity_hint: 경미}
  G10:   # CapEx 종합
    - {text: "상온창고 자연환기(그릴창)뿐 — 급배기팬+기류유인팬, SPOT COOLING 추가 필요. 창고에서 사무실로 바뀐 구간 냉난방 추가 필요", page: 62, severity_hint: 경미}
  FR01:  # 패널 심재 가연성
    - {text: "외벽 THK125 EPS 판넬, 지붕 THK260 EPS 판넬(도면 THK225) — 준불연 시험성적서(KS F ISO 5660-1) 확인", page: 15, severity_hint: 경미}
  FR02:  # 방화구획 대면적
    - {text: "상온창고 3,000㎡ 이하, 냉동창고 1,000㎡ 이하마다 구획, THK125 그라스울 1시간 내화 벽체·스크린 방화셔터 성적서 확인", page: 28, severity_hint: 양호}
  FR03:  # 스프링클러 형식 부적합
    - {text: "냉동창고 내부는 영하 온도로 스프링클러·옥내소화전 면제 미설치, 상수도소화용수설비 2개소로 대체", page: 46, severity_hint: 경미}
  FR04:  # 저온동 단열재 화재
    - {text: "냉동창고 방열 우레탄 발포 + 난연코팅 — 제출된 준불연코팅재 시험성적서의 바탕모재(우레탄폼)가 현장 시공과 같다고 볼 수 없음", page: 21, severity_hint: 결함}
  CL01:  # 냉동설비·냉매 리스크
    - {text: "냉동창고별 개별식 냉동시스템, 로컬·방재실 중앙제어 가능, 냉각탑 700RT×2 도면 일치", page: 45, severity_hint: 양호}
    - {text: "냉동기 하절기 시운전 미실시 — 다음 하절기 시운전 결과 추적 필요", page: 62, severity_hint: 경미}
  CL03:  # 단열 패널 열화·결로
    - {text: "지하2층 냉동창고 대부분에서 누수·결로로 인한 결빙, 배관을 통한 누수 추정 구간 다수", page: 24, severity_hint: 결함}
    - {text: "방열 미시공 기둥 중간부 결로(1F·B2), 1층 냉동창고 도면에 없는 환기창에서 누기 결빙", page: 23, severity_hint: 결함}
    - {text: "지하2층 방열 보수 흔적 다수·우레탄 뿜칠 크랙, 유니트쿨러·천정 배관 간섭으로 단열 두께 부족·손상 다수", page: 23, severity_hint: 경미}
