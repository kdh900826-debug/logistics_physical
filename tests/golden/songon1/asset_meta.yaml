notes:
  - "준공: 가동·나동 2021-10-19 사용승인(p7). 실사 2021.11.10·12, 보고서 2021.11.22. 실사 ㈜한미글로벌건축사사무소, 발주자 ㈜코람코자산운용(p2). 시공 계성건설."
  - "구성: 가동 B2~3F. B2·1F 냉동창고(실사 시 냉장 운용 -4~5℃), B1 기계·전기실 등, 2F·3F 상온창고. 전 창고층 하역장에 차량 직접 접안(램프)."
  - "온도대 변경: 지상2층은 골조공사 완료 후 냉동창고에서 상온창고로 바뀌었다. 그 결과 (1) 창고-ELEV홀 사이 바닥 단차(바닥 마감 두께 변경, p19), (2) 수전용량 4,000kW → 3,500kW 감소(p48), (3) 해당 구간 CCTV 삭제(p53)가 생겼다. 보고서는 향후 임차인 요청에 따른 냉동↔상온 변경은 범위에서 제외했다(p6)."
  - "대형차 동선: 2층 램프→하역장 동선상 기둥으로 40ft 트레일러 진출입 곤란(p21), 램프 곡선구간에서 40ft 반대차선 침범(p36), 1층 냉동 하역장은 상온 전환 후 대형차가 기둥 사이 통과 어려움(p14)."
  - "층 표기 혼선: 구조편 p39 '지하1~2층은 냉동창고, 지상1~3층은 상온창고'는 건축편(p8, p14, p21)과 달라 건축편을 따랐다."
  - "같은 단지의 물류2센터(골든 songon, 2022.12 준공)와 시공사·설계 계열이 같다. 두 자산 모두 40FT 대형차 동선 제약이 지적됐다."
