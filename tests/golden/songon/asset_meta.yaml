notes:
  - "준공: 가동·나동 2022-12-22 사용승인(p7). 준공도서 2022.11.30, 실사 2023.01.06·18, 보고서 2023.02.07. 신축이라 phase는 '원준공' 하나다."
  - "실사: ㈜한미글로벌건축사사무소, 발주자 ㈜코람코자산운용(p2). 매매계약 변경(2차 변경계약서)과 관련된 설계변경 검토 포함(p6, p47-52)."
  - "구성: 가동 B2~3F. B2 저온창고(#1~#4 상온/저온 겸용 하이브리드, #5~#6 저온), B1 기계·전기실·임대사무실, 1~3F 상온창고. 각 층 하역장에 차량이 직접 접안한다(B2는 지상1층→지하2층 램프, 2·3층은 지상1→3층 램프)."
  - "램프: 지상1층→지하2층 램프 폭 4m — 40FT 컨테이너 곡선구간 양방향 교행 어려움. B2 하역주차장의 컨테이너 주차 위치(실시설계 기준 시공) 기준으로 출차 회전반경이 작아 최좌측 40FT 차량은 한 번에 출차 램프 진입이 어려움 — B2를 상온창고로 운영할 때 문제가 된다(p16, p40, p48, p82). 지상1→3층 램프는 이중벽·경사 구조로 누수 사고 이력(p39, p42)."
  - "연면적: 준공도면 54,926.80㎡(경비동 12㎡ 포함)와 사용승인서 54,924.94㎡가 다르다(p7). 골든 gross_floor_area_m2는 가동만(54,914.80㎡, p8 지하·지상 소계 합)."
  - "나동 층 표기: p7은 '1 층 규모(지상 1 층)', p8 면적표는 '지하2 층 12.00m2'. 대지 레벨상 B2 레벨 진입부에 있는 것으로 추정."
  - "기존 icheon 골든(이천 상봉리, 세방)과 다른 자산이다."
