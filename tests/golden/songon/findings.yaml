# 필수 학습 항목(사용자 지정): 지하층 상온 전환 시 40FT 컨테이너 출차 회전반경 제약 — SP05·SP06·CL04에 교차 기록
findings:
  SP05:  # 램프·차량 접근 제약
    - {text: "[필수] 지하2층 하역주차장 컨테이너 주차 위치 기준 출차 동선 회전반경이 너무 작아 최좌측 40FT 컨테이너 차량은 한 번에 출차 램프 진입이 어려움(도면 회전반경 표기 R-12M) — 주차위치 조정·주차관리 필요. B2가 냉동창고일 땐 40FT 운행이 없어 문제없지만 상온창고로 운영하면 고려해야 함", page: 40, severity_hint: 결함}
    - {text: "지상1층→지하2층 램프 폭 4m — 40FT 컨테이너 운행 시 곡선구간 양방향 교행 어려움, 운영상 관리 조치 필요", page: 40, severity_hint: 결함}
    - {text: "지하2층 주차계획: 컨테이너 차량 위치가 준공도면과 다르게 실시설계 기준으로 시공됨 — 회전반경 고려 위치조정 필요", page: 48, severity_hint: 경미}
    - {text: "램프 난간대·난간 단부 마감 불량(3층~2층 램프, 지상3층 램프)", page: 89, severity_hint: 경미}
  SP08:  # 대형차 회전반경 부족
    - {text: "[필수] 지하2층 램프 도면 회전반경 R-12M(세미트레일러 최소회전반지름 12.0m와 같음, 여유 없음) — 현장 컨테이너 주차 위치 기준으로 최좌측 40FT 차량이 한 번에 출차 램프로 진입하지 못함. B2 상온 운영 시 주차위치 조정·주차관리 필요", page: 40, severity_hint: 결함}
  SP06:  # 트럭야드 협소
    - {text: "[필수] 지하2층 하역주차장: 현장 컨테이너 주차 위치 기준 출차 회전반경 부족 — 40FT 최좌측 차량 1회 진입 불가 예상, B2 상온 전환 시 주차위치 조정 필요", page: 40, severity_hint: 결함}
