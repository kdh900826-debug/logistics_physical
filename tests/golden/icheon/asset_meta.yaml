notes:
  - "준공연도: A동은 2023-12-07 사용승인 신축이다(p5, p16, p75). 증축이나 대수선 이력은 없으므로 phase를 나누지 않았다(전체 '원준공'). 기계·전기 장비 설치(p58·p63·p66), 토목 '준공 후 약 1년 8개월'(p8), 소화기 제조 2023.06(p75)도 모두 2023년 준공과 맞는다."
  - "p11 Executive Summary 7.소방의 '2007년 5월 사용승인 후 18년이 경과한 건축물'은 타 보고서 문구가 남은 것으로 본다. 같은 문단의 실사일 2025.04.17(실제 현장실사 2025.08.28), 옥내소화전 19개소(본문 p74 61EA), 수원 20m3(본문 51.2ton), 지하1층에만 SP헤드(본문 '전층'), 완강기 B동 3층(본문 p77 '협의하에 제외'), 수신기 P형 경비실(본문 GR형 B1F 방재실)이 모두 본문 소방편(p74-79)과 다르다."
  - "B동(기숙사, 지상1~3층, 현재 사무실 용도)·C동(경비실)은 p30 '부대시설로서는 B 동(기숙사) 지상1~3 층과 C 동(경비실)이 진입 초입에 위치'와 p11에만 나온다. 건축개요(p16)·층별 사용현황(p17)·연면적 43,798.61㎡에는 포함되지 않고, 사용승인 연도·면적도 적혀 있지 않다. p47은 소개자료의 '근로자 지원시설(주차장 포함)'이 아직 조성되지 않았다고 적었다. 별도 건축물인지(가설건축물 여부 포함)는 확인이 필요하다."
  - "A동 구성: B1~4F, PC조(지붕 철골), 2F는 사무·부자재창고 메자닌(783.43㎡). 대지 레벨 차를 이용해 B1(남측)·1F(동·서측) 하역장은 지상 야드에서 직접 접안하고, 3F는 건물 내부 1→3층 램프로, 4F는 3→4층 램프로 접안한다(p31). 실사 당시 1·3층만 운영 중이었고 4층은 미운영이었다(p30, p41)."
  - "지하1층 저온창고: 저온·냉장창고로 설계됐지만(p17) 저온설비를 가동하지 않는다. 도면상 Unit Cooler 25대는 미설치이고 제습기 2대로 운영한다(p8-9, p58). 상온 전환 공사를 예정하고 있다(8인치 블록 방화벽 → 글라스울 판넬+방화셔터, 환기팬, 소방; 견적 12.87억원 vs 검토 7.32억원, p85-88)."
  - "층 표기 혼선: 토목편(p8, p49-57)은 남측 최하층 하역장을 '지하2층 하역장'으로 적었고, p6에는 '지하 4층도 1면에 하역장', p38에는 '지하 3층 하역장 상부 오염', p41에는 '지하2 층 복도'가 나온다. 문맥상 각각 B1 하역장, 지상4층, 지상3층, 지하1층의 오기로 본다."
  - "실사: (주)범씨엠건축사사무소, 의뢰인 그래비티자산운용㈜, 실사기간 2025.08.25~09.08, 현장 2025.08.28, 보고서 2025.09. 구조계산서는 제공되지 않아 설계하중이 미확인이다(p26)."
