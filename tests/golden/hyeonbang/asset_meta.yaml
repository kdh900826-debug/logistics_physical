  - "실사: (주)범씨엠건축사사무소, 의뢰 켄달스퀘어자산운용, 현장 2026-07-01~02, 보고서 2026.08. 설계 ㈜차건축사사무소, 건축주 ㈜지산산업, 시공 ㈜태영건설, 감리 희림종합건축사사무소."
  - "같은 설계의 2개 동(각 B1~4F). B1 저온창고, 1F·3F 사무실, 2F·4F 상온창고. 지형 단차를 이용해 B1·2F·4F 상하차장에 각각 진입도로(보강토·판넬 옹벽)로 직접 접안 — 건물 램프가 아니라 단지 도로라 ramp_type은 넣지 않았다."
  - "임차(실사 시): A동 B1~3F 동원로엑스, B동 2~4F 해동물류(p40). A동 4F 공실, B동 B1 공실·냉동설비 가동 중단(p76, p81)."
  - "준공: A동 2023-05-12(p20, 소방완공), p6은 '2023년 6월 28일 동별사용승인'. B동 2023-04-28."
  - "B동은 지하수(심정펌프)로 급수, A동은 상수도(p12, p80)."
  - "외벽 판넬 두께가 p20·p21 표(THK150)와 p7·p41 본문(THK125)이 다르다."
