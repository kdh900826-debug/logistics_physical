# IM–도면 허용오차 (설계서 §2.3 W2-④, U13)
# 판정 폭 = max(abs, rel × |IM 값|). IM 표기 정밀도(approx·rounded)는 반폭을 추가로 고려한다.
# 수치는 초안 — 골든 샘플 판독 결과를 보고 확정한다 (verified: false).
verified: false

defaults_by_unit:
  m2:   {abs: 1.0, rel: 0.01}      # 평↔㎡ 환산·반올림 흡수
  m:    {abs: 0.1, rel: 0.0}
  mm:   {abs: 5, rel: 0.0}
  t/m2: {abs: 0.05, rel: 0.0}
  pct:  {abs: 0.5, rel: 0.0}
  kW:   {abs: 0, rel: 0.02}
  kVA:  {abs: 0, rel: 0.02}
  t:    {abs: 0.1, rel: 0.0}
  year: {abs: 0, rel: 0.0}
  ea:   {abs: 0, rel: 0.0}
  floor: {abs: 0, rel: 0.0}

fields:
  clear_height_m:   {abs: 0.3, rel: 0.0}
  floor_height_m:   {abs: 0.3, rel: 0.0}
  floor_load_tpm2:  {abs: 0.05, rel: 0.0}
  gross_floor_area_m2: {abs: 1.0, rel: 0.005}
  ramp_slope_pct:   {abs: 0.5, rel: 0.0}
  column_span_x_m:  {abs: 0.1, rel: 0.0}
  column_span_y_m:  {abs: 0.1, rel: 0.0}
