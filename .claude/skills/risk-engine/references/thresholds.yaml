# ─────────────────────────────────────────────────────────────────────────────
# thresholds.yaml — 룰 임계값 (설계서 §3.7 / §3.8)
#
# 작성: Claude 조사 초안 (2026-10-13). 모든 항목 verified: false → 사용자 확인 전까지
#       이 값에 의존하는 판정은 ⚪("기준값 미검증")로 처리된다(§3.7).
# 원칙:
#   - 출처를 찾은 값만 넣었다. 출처가 없는 임계값은 값 자체를 두지 않고 하단 unresolved:에
#     검색 이력과 함께 기록했다(해당 룰/등급은 비활성).
#   - 해석 순서: overrides(when 일치) → default. when 키는 threshold_segment
#     (temp_zone: 상온|저온|복합, handling_type: 단층|다층 램프형|다층 지형접안형|다층 승강기형) 를 기본으로 하되,
#     SP05는 Core Spec ramp_type(단방향|양방향)·ramp_form(직선형|곡선형|나선형)을 세그먼트로 쓴다(엔진 측 지원 필요).
#   - 방향(direction): lower_is_worse → 값 < 임계 시 발동 / higher_is_worse → 값 > 임계 시 발동.
#   - source 문자열: "<발행처/법령·조문> | <문서명·일자> | <URL>". 2차 자료(법령정보 미러 사이트,
#     기사·기고)는 note에 그 사실을 적었다. 법령 원문은 국가법령정보센터(law.go.kr)에서 재확인 필요.
# ─────────────────────────────────────────────────────────────────────────────

# ── B. 스펙 (도면) ───────────────────────────────────────────────────────────

floor_load:            # t/m2, 창고층 바닥 설계하중 — SP01 (floors.floor_load_tpm2, warehouse 층 min)
  unit: t/m2
  direction: lower_is_worse
  default:
    red:
      value: 1.5
      source: "physical_risk_engine.md S02 (내부 v1 엔진 문서: '바닥하중 1.5t/㎡ 이상') — 2026-10-13 사용자 확정(채팅)"
      verified: true
      note: "2026-10-13 등급 단일화(사용자 지시): 🔴 1.5 하나만 둔다(🟡 삭제). 이전 값: 🔴 1.2(klnews 2012 기고 'KBC2009 물류창고 최소 적재하중 1.2ton/㎡', 미확정) · 🟡 1.5. 시장 근거: 같은 기고는 2000년대 이후 창고가 '2.0ton/㎡ 혹은 그 이상'으로 설계되고 700kg 팔레트 하이랙 시 평균 '1.9ton/㎡ 이상'이라고 기술. 현행 KDS 41 12 00 창고 활하중 원문은 미확인."
      verified_by: user
      verified_at: '2026-10-13T16:00:00+09:00'
  overrides: []          # 저온 override: 출처 미확보 → unresolved 참조

clear_height:          # m, 창고층 유효층고 — SP02 (floors.clear_height_m, warehouse 층 min)
  unit: m
  direction: lower_is_worse
  default:
    yellow:
      value: 8.5
      source: "정휘철, '물류센터 층고 설정 관련 자료', LinkedIn, 2022-04-04 — 층고 10m 내역(적재 8m + 4단 인상 0.5m + 소방배관 1.5m)에서 배관 하단까지 = 8.5m | https://kr.linkedin.com/pulse/%EB%AC%BC%EB%A5%98%EC%84%BC%ED%84%B0-%EC%B8%B5%EA%B3%A0-%EC%84%A4%EC%A0%95-%EA%B4%80%EB%A0%A8-%EC%9E%90%EB%A3%8C-%ED%9C%98%EC%B2%A0-%EC%A0%95"
      verified: true
      note: "2026-10-13 개정: SP02는 유효층고(천정·보·배관 하단)를 비교한다(사용자 결정). 기존 10.0은 외부 자료상 '층고(FL~FL)' 값이라 유효층고 기준으로는 과도함 — 골든 사례에서 신축 A급 두 자산(청라 천정고 9.25m, 석남 스프링클러 배관 하단 실측 7.58m)이 모두 🟡가 됨. 출처의 층고 내역에서 소방배관 1.5m를 뺀 8.5m를 후보로 둔다(적재 8m + 4단 인상 0.5m). 대안: 내부 엔진 문서 physical_risk_engine.md S02는 '유효층고 10m 이상'으로 적고 있음 — 외부 근거와 상충하므로 사용자 판단 필요. 보조 근거: klnews 2012 '하이랙을 고려하여 10m 내외로 층고를 높인 창고'(층고 기준)."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  overrides: []          # red 및 저온 override: 출처 미확보 → unresolved

column_span:           # m, 기둥 스팬(min(x,y)) — SP03 (column_span_x_m / column_span_y_m)
  unit: m
  direction: lower_is_worse
  default:
    yellow:
      value: 11.0
      source: "물류신문, 이승환, '기둥 간격의 혁신, 물류센터의 경쟁력 높일 수 있어', 2020-07-15 | https://www.klnews.co.kr/news/articleView.html?idxno=121614"
      verified: true
      note: "기사: 대다수 물류센터는 '11m x 11m(기둥 간격)의 정형화된 평면 모듈'. 1.1m 팔레트·2.5m 랙 폭 기준. 보조: klnews 2012 기고 '최근 새로 지어지는 물류창고들 대부분이 11m×11m 기둥 간격'. 11m 미만 = 시장 표준 모듈 미달 → 🟡. 참고(임계 아님): 같은 기사는 데드스페이스 최소화 스팬으로 10.6/11.85/13.25/14.5m, klnews 2012는 VNA 최적 12.3m 제시."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  overrides: []          # red: 출처 미확보 → unresolved

ramp_slope:            # %, 램프 종단경사 — SP05 (ramp_slope_pct)
  unit: pct
  direction: higher_is_worse
  default:               # 직선형 램프(단방향·양방향)
    red:
      value: 9
      source: "골든"
      verified: true
      note: "2026-10-13 사용자 수정: 17 → 9, 등급 단일화(🟡 삭제, 채팅 지시). 참고 — 조사한 기준: 주차장법 시행규칙 제6조(승용차) 직선 17%·곡선 14%, 도로의 구조·시설 기준에 관한 규칙 제25조 표(세미트레일러·대형차, 집산도로 및 연결로 30km/h) 산지등 12%·평지 7%."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  overrides:
    - when: {ramp_form: 나선형}
      red:
        value: 9
        source: "골든"
        verified: true
        note: "곡선 부분 상한 14%. / 2026-10-13 사용자 수정: 14 → 9."

        verified_by: user
        verified_at: '2026-10-13T15:12:57+09:00'
ramp_width:            # m, 램프 차로 폭 — SP05 (ramp_width_m)
  unit: m
  direction: lower_is_worse
  default:               # 직선형 1차로(단방향)
    red:
      value: 6.5
      source: "골든"
      verified: true
      note: "2026-10-13 사용자 수정: 3.3 → 6.5, 등급 단일화(🟡 삭제, 채팅 지시). 참고 — 조사한 기준: 주차장법 시행규칙 제6조(승용차) 직선 1차로 3.3m, 도로의 구조·시설 기준에 관한 규칙 제34조 연결로 C기준(세미트레일러 통과) 차로 3.25 + 길어깨 1.00 + 0.75 = 5.0m. ramp_width_m이 연석 포함 전체 폭인지 차로 폭인지 도면마다 다르므로 G2에서 확인. 나선형은 제22조 곡선부 확폭(세미트레일러 R20~30m 차로당 +2.00m 등)이 더 필요하지만 곡선반지름 필드가 없어 미반영(DD)."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  overrides:
    - when: {ramp_type: 양방향}
      red: {value: 7.5, source: "도로의 구조·시설 기준에 관한 규칙 제34조제3항 연결로 C기준 — 차로 3.25×2 + 양방향 다차로 길어깨 오른쪽 0.50×2", verified: true, note: '2026-10-13 사용자 수정: 6.0(주차장법 직선 2차로) → 7.5, 등급 단일화(🟡 삭제). 중앙분리대가 있으면 C기준 1.50m(부득이 1.00m)가 더 필요. 나선형 양방향은 이 override가 먼저 걸려 확폭 미반영(DD).', verified_by: user, verified_at: '2026-10-13T15:12:57+09:00'}
    - when: {ramp_form: 나선형}
      red:
        value: 6.5
        source: "골든"
        verified: true
        note: "나선형이 2차로이면 6.5m. Core Spec ramp_type이 나선형 차로 수를 구분하지 않으므로 엔진/DD에서 확인 필요. / 2026-10-13 사용자 수정: 3.6 → 6.5."
        verified_by: user
        verified_at: '2026-10-13T15:12:57+09:00'
  reference:             # 임계값 아님 — 화물차 기준의 차량 제원(SP05·SP06 서술·DD용)
    design_vehicle_semitrailer_m:
      value: {폭: 2.5, 높이: 4.0, 길이: 16.7, 앞축간거리: 4.2, 뒤축간거리: 9.0, 앞내민길이: 1.3, 뒷내민길이: 2.2, 최소회전반지름: 12.0}
      source: "도로의 구조·시설 기준에 관한 규칙 제5조제2항 표(설계기준자동차 제원) (국토교통부령 제1588호, 시행 2026-06-03) | 국가법령정보센터 https://www.law.go.kr/법령/도로의구조·시설기준에관한규칙"
      verified: false
      note: "대형자동차는 폭 2.5·높이 4.0·길이 13.0·축간거리 6.5·최소회전반지름 12.0m, 승용자동차는 길이 4.7·최소회전반지름 6.0m. 제5조제1항: 주간선도로 = 세미트레일러, 보조간선·집산도로 = 세미트레일러 또는 대형자동차."

# ── C. 화재 ──────────────────────────────────────────────────────────────────

fire_compartment_area: # m2, 방화구획 최대 면적 — FR02 (fire_compartment_max_m2)
  unit: m2
  direction: higher_is_worse
  default:               # 스프링클러 등 자동식 소화설비 설치(물류센터 일반)
    yellow:
      value: 3000
      source: "건축물의 피난·방화구조 등의 기준에 관한 규칙 제14조제1항제1호 | 네플라 법령 본문 https://www.nepla.ai/law/건축물의 피난·방화구조 등의 기준에 관한 규칙 (원문 law.go.kr 재확인 필요)"
      verified: true
      note: "'10층 이하의 층은 바닥면적 1천제곱미터(스프링클러 기타 이와 유사한 자동식 소화설비를 설치한 경우에는 바닥면적 3천제곱미터)이내마다 구획'. 최대 구획이 3,000㎡ 초과 = 건축법 시행령 제46조제2항제2호 완화(창고 특례) 적용 구획으로 추정 → 🟡 + regulation_timeline의 2022-04-29 개정(보관 용도 완화 제외) 이전/이후 준공 여부로 DD. 🔴 기준값은 출처 미확보."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  overrides: []
  reference:             # 임계값 아님 — Core Spec에 '스프링클러 미설치'를 표현할 필드가 없어 override 대신 참고로 둠
    no_sprinkler_limit_m2:
      value: 1000
      source: "건축물의 피난·방화구조 등의 기준에 관한 규칙 제14조제1항제1호 (위와 동일)"
      verified: false
      note: "자동식 소화설비 미설치 시 1,000㎡. 11층 이상은 200㎡(설비 시 600㎡) — 물류센터는 통상 해당 없음."

sprinkler_esfr_clear_height:   # m — FR03 (sprinkler_type × clear_height_m)
  unit: m
  direction: higher_is_worse
  default:
    red:
      value: 13.7
      source: "창고시설의 화재안전성능기준(NFPC 609) 제7조제1항제4호, 소방청고시 제2023-39호(2023-10-06 제정, 2024-01-01 시행) | https://www.ulex.co.kr/%EB%B2%95%EB%A5%A0/2100000229924-86784-%EC%B0%BD%EA%B3%A0%EC%8B%9C%EC%84%A4%EC%9D%98 ; 국가법령정보센터 https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000229924&chrClsCd=010201"
      verified: true
      note: "천장 높이 13.7m 이하 랙식 창고에 한해 화재조기진압용(ESFR, NFPC 103B) 설치 가능. 보조: 스프링클러설비의 화재안전기준(NFSC 103) 제10조제2항 '랙크식창고의 천장높이가 13.7m 이하로서… 천장에만 스프링클러헤드를 설치할 수 있다'(https://www.ulex.co.kr/%EB%B2%95%EB%A5%A0/2100000199295-35312-%EC%8A%A4%ED%94%84%EB%A7%81%ED%81%B4%EB%9F%AC). 해석: 유효층고(≈천장고) > 13.7m인데 천장형(표준형·ESFR)만 있고 인랙 없음 → 🔴. 13.7m = 45ft로 NFPA 13/FM 8-9 ESFR 상한과 대응한다는 점은 제조사 2차 자료로만 확인(FM DS 8-9 원문 미확인)."
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
  reference:             # 임계값 아님 — 룰 서술·DD용 참고 수치
    rack_head_interval_nfpc609_m:
      value: 3
      source: "NFPC 609 제7조제1항제2호 (위 출처)"
      verified: false
      note: "창고시설(2024-01-01 이후 신청분) 랙식 창고는 랙 높이 3m 이하마다 라지드롭형 헤드 추가 설치. 수원: 기준개수(최대 30)×3.2㎥(랙식 9.6㎥), 랙식 창고 비상전원 60분."
    rack_head_interval_nfsc103_m:
      value: {특수가연물: 4, 기타: 6}
      source: "스프링클러설비의 화재안전기준(NFSC 103) 제10조제2항 | https://www.ulex.co.kr/%EB%B2%95%EB%A5%A0/2100000199295-35312-%EC%8A%A4%ED%94%84%EB%A7%81%ED%81%B4%EB%9F%AC"
      verified: false
      note: "구 기준: '랙크높이 4m 이하마다, 그 밖의 것을 취급하는 것에 있어서는 랙크높이 6m 이하마다'. NFPC 609 이전 준공 자산의 표준형 + 고층고 판단 시 참고."

# ── F. 입지 ──────────────────────────────────────────────────────────────────

flood_depth:           # m, 홍수위험지도 예상 침수심 — LC01 (flood_depth_m)
  unit: m
  direction: higher_is_worse
  default:
    yellow:
      value: 0.5
      source: "기후에너지환경부 한강홍수통제소, 홍수위험지도(20241231), 공공데이터포털 | https://www.data.go.kr/data/15077744/fileData.do"
      verified: true
      note: "데이터셋 침수심 구간: '0.5m 이하, 0.5~1.0m, 1.0~2.0m, 2.0~5.0m, 5.0m 이상'. 0.5m는 공식 '구간 경계'이지 리스크 임계로 공표된 값이 아님 — 임계 채택 여부는 사용자 판단. 시나리오는 제방붕괴 등 최악 가정(실제 제방 안정성과 무관), 빈도(100/200/500년 등) 지정 필요."

# ── A. 연식 (v1 이식) ────────────────────────────────────────────────────────
# 아래 값은 모두 내부 v1 오피스 엔진에서 이식. 물류센터 특화 근거는 대부분 미확보.

# 룰 키 매핑: G01=aging_piping, G02=aging_substation, G05=aging_fire_system, G06=aging_roof, G09=aging_compliance, G10=aging_capex
# G03=aging_elevator, G04=aging_generator, G07=aging_pavement, CL01=cold_refrigeration_age
      verified_by: user
      verified_at: '2026-10-13T15:12:57+09:00'
aging_piping:
  unit: years
  direction: higher_is_worse
  default:
