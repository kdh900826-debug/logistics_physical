    - "바닥 보수 면적과 마감 중복(에폭시 + 하드너)"
    - "이미 철거된 장비(유니트쿨러 등)의 철거비가 들어 있는지"
    - "간접비 요율(간접노무비·기타경비·일반관리비·이윤)과 퇴직공제부금(민간공사 50억 미만은 제외)"
    - "유인팬 수량의 환기량 계산 근거, 전원 방식(전열 콘센트 추가 필요 여부)"
    - "소방공사·인허가 포함 여부가 견적마다 달라 총액끼리 바로 비교하지 않는다(상봉리 12.87억은 소방·인허가 제외, 11.47억은 소방 포함)"

post_conversion_notes:       # 전환 뒤 운영·설계 관련 관찰
  - "부분 전환 시 열교·결로: 일부 층만 상온으로 바꾸고 저온층이 남으면 그 경계(천정·바닥)에서 열교로 결로가 생긴다 — 석남 SNK 견적은 1층 천정 추가 방열 100T에 5.1억(직접공사비의 약 15%, 산출값)을 넣었다. 어느 층이 저온으로 남는지 확인"
  - "방화구획선 이동: 저온 설계는 하역장 쪽에 방화셔터, 도크에 저온 OHD를 둔다. 상온 전환 시 하역장 방화셔터 → 상온 OHD, 도크 저온 OHD → 방화셔터로 맞바꾸고 OHD 철거부 상부에 방화벽을 새로 만든다(석남 SNK 견적 p3·p5·p14)"
  - "견적 범위 분리: 시공사 견적과 사업주 직발주분(설계·인허가·감리·전기·소방)이 나뉘는 경우가 많다 — 석남 SNK는 직발주분이 8.7억(전체의 약 17%, 산출값). 총액 비교 전에 범위를 맞춘다"
  - "저온 전용 변압기 휴지: 상봉리 TR-2(1,000kVA, 저온창고 장비동력)를 휴지하고 한전 계약을 2,900→1,900kVA로 바꾸면 기본요금이 준다(상봉리 실사 p63)"
  - "바닥 설계가 저온·상온 공통이면 전환 시 바닥 재시공·단차가 없다: 상봉리 B1은 저온·상온 구간 바닥 마감이 같다(배수판·우레탄 150 단열·고강도 콘크리트, 실사 p42). 반대로 송온1 2층은 골조 후 냉동→상온 변경으로 바닥 마감 두께가 달라 ELEV홀 단차가 생겼다(golden songon1 p19)"
  - "도면과 현장 벽체 상이(상봉리 B1 도면 8인치 블록 → 현장 블록+글라스울 판넬, p42) — 철거 물량은 현장 실측으로"

cost_drivers:              # 사례 비고에서 읽히는 평단가 결정 요인 (사례 6건의 정성 관찰, 통계 아님)
  - "소방설비 전면 교체(52만원/평) vs 부분 수정(30~43만원/평)"
  - "기둥 마감(단열) 철거 여부 — 미철거 사례가 최저(30만원/평)"
  - "챔버 구획 유지 여부 — 유지하면 철거 범위가 줄어 낮은 편(30·32만원/평)"
  - "부대시설 추가(화장실 등)"
  - "범위: 30만 ~ 52만원/평, 6건 중앙값 약 39만원/평(산출값). 예비비 별도"
  - "상봉리 2025-09-16 견적 약 39.5만원/평(산출값)도 이 범위 안 — 방화스크린셔터 재구획(1.68억)과 폐기물(약 1.62억)이 큰 항목"
