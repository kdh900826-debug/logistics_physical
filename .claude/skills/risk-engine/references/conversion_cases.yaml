# 온도대 전환(컨버전) 사례집 — CL04 서술·DD용 참고 자료 (판정 임계값 아님)
#
# 용도: risk-evaluator가 CL04(온도대 전환 유연성) 서술과 자료 요청 목록을 쓸 때 시장 사례로 인용한다.
#       엔진 판정에는 쓰지 않는다. 수치는 각 출처 그대로이며 검증 전(주로 IM·견적) 값이다.
# 단위: 평단가 = 원/평. 면적 기준은 출처마다 다르므로 basis에 적는다. 평 = 400/121 ㎡.
# 2026-10-13 작성(사용자 요청: 원창 IM 인쇄 p33 '컨버전 인허가 절차, 공사 사례' 학습)

permit_process:            # 저온 → 상온 컨버전 인허가 (원창 IM 인쇄 p33)
  source: "[NHIS] 그레이트 원창 물류센터 매입 담보대출_v3.0_20260908.pdf — 인쇄 p33(PDF p34) 'Ⅳ.5 상온 컨버전 공사 / 공사 인허가'. 원출처 큐브인더스트리얼자산운용"
  grade: IM주장
  steps:
    - {step: 업체 선정, period: "2026.03 ~ 2026.06", note: "인허가(대수선)·설계를 위한 설계업체·CM업체 선정. 인허가 시 법적(소방·전기 등) 리스크 사전 검토"}
    - {step: 인허가, period: "2026.07 ~ 2026.09", note: "해체심의 + 대수선 인허가 완료까지 약 2개월, 철거 심의(승인) 1개월(동시 진행). 현 소유자(매도인 KB신탁) 동의를 받아 진행(협의 완료)"}
    - {step: 착공 신고, period: "2026.09 (예정)", note: "Phase 1(1·3·4·8·9층, 5개 층) 착공 신고. 착공필증 발급까지 1개월 이내"}
  takeaways:
    - "인허가는 해체심의 인허가와 대수선 인허가 두 갈래다. 원창은 해체심의 완료, 대수선 접수 완료(IM 기준일)."
    - "대수선 인허가는 통상 1개월 이내, 보완·조건부 가결이면 2주 추가(총 6주 이내)."
    - "매입 전에 인허가를 진행하려면 현 소유자(매도인) 동의가 필요하다."
    - "업체 선정부터 착공필증까지 IM 일정상 약 7개월(2026.03 → 2026.09 신고 + 필증 1개월)."

