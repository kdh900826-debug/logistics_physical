    source_url: "https://www.nepla.ai/wiki/국토와-건설-부동산/건설-건축-주거환경/-유권해석-건축법-시행령-제46조-방화구획-등의-설치-gy380w3enrxk ; https://www.kfsi.or.kr/contents/webzine/202212/sub02-02.html"
