    rule_refs: [FR01]
    title: "복합자재 실물모형시험·강판·심재 요건 신설"
    law: "건축물의 피난·방화구조 등의 기준에 관한 규칙(국토교통부령 제1106호, 2022-02-10 공포) 제24조제11항 신설"
    effective_date: "2022-02-11"
    effective_date_basis: "부칙 '이 규칙은 2022년 2월 11일부터 시행한다'"
    applies_to: "부칙에 별도 적용례 없음(확인 범위 내). 제품 품질인정 체계와 연동 — 산군 블로그(2차)는 기존 제품 품질 유효기간 만료 시까지 실물실험 유예라고 설명"
    summary: "복합자재를 마감재료로 쓸 경우 ① 강판+심재 일체로 국토부 고시 기준의 실물모형시험 통과 ② 강판 도금 후 도장 전 0.5mm 이상, 앞면 도장 2회 이상 등 ③ 강판을 제거한 심재가 그라스울·미네랄울 기준 충족 또는 불연·준불연재료. 문화일보(2021-03-10)는 하위법령이 심재 단독 시험을 요구해 '스티로폼, 우레탄폼 심재 사용이 사실상 금지'된다고 보도."
    source_url: "https://www.law.go.kr/lumLsLinkPop.do?lspttninfSeq=105201&chrClsCd=010202 ; https://www.munhwa.com/article/11230737"
    verified: true

