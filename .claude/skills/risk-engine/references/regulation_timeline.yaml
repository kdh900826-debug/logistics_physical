# ─────────────────────────────────────────────────────────────────────────────
# regulation_timeline.yaml — 룰 판정용 규제 변경 이력 (FR01·FR02·FR03·CL01·G08)
#
# 작성: Claude 조사 초안 (2026-10-13). 모든 항목 verified: false.
# 원칙:
#   - effective_date = 시행일(공포일 아님). 부칙 문언("공포 후 N개월이 경과한 날")에서 날짜를
#     산정한 경우 effective_date_basis에 '산정'으로 표기했다. 시행일을 확인하지 못한 항목은
#     effective_date를 두지 않고 unresolved:에 올렸다.
#   - 대부분의 개정은 '시행일 이후 건축허가(신고·용도변경) 신청분'부터 적용된다. 따라서 엔진은
#     준공연도(completion_year)가 아니라 허가 신청 시점으로 비교해야 하며, 허가일을 모르면
#     준공연도 기준 비교는 '추정'으로만 표기할 것(허가~준공 시차 1~3년).
#   - 법령 본문 출처 중 nepla.ai / ulex.co.kr 은 법령정보 미러(2차)다. law.go.kr 원문 재확인 필요.
# ─────────────────────────────────────────────────────────────────────────────

regulations:

  # ── FR01: 외벽·지붕 샌드위치 패널(복합자재) 심재 ─────────────────────────

  - id: ext_wall_finish_2019
    rule_refs: [FR01]
    title: "외벽 마감재료 기준 개정 (피난·방화규칙 제24조제5항~제7항)"
    law: "건축물의 피난·방화구조 등의 기준에 관한 규칙(국토교통부령 제641호, 2019-08-06 공포) 제24조제5항~제7항; 건축법 시행령 제61조제2항(2019-08-06 개정 태그)"
    effective_date: "2019-11-07"
    effective_date_basis: "산정 — 부칙 제1조제1호 '제24조제5항부터 제7항까지의 개정규정: 공포 후 3개월이 경과한 날'"
    applies_to: "부칙상 제24조 관련 적용례 문언은 미확인(같은 부칙의 계단·방화구획 적용례는 '시행일 이후 건축허가 신청·건축신고분')"
    summary: "외벽 마감재료 조항 개정. 현행 건축법 시행령 제61조제2항은 외벽 규제 대상으로 '3층 이상 또는 높이 9미터 이상인 건축물'(제3호)과 '제1항제4호에 해당하는 건축물'(제5호 = 공장, 창고시설 등)을 규정. 2019 개정으로 대상이 6층/22m에서 3층/9m로 확대되었다는 설명은 2차 검색 요약에서만 확인(원문 대비표 미확인). 2019 개정의 구체적 조문 변경 내용은 확인 필요."
    source_url: "https://www.nepla.ai/law/건축물의 피난·방화구조 등의 기준에 관한 규칙 ; https://www.nepla.ai/wiki/국토와-건설-부동산/건설-건축-주거환경/-유권해석-건축법-시행령-제61조-건축물의-마감재료-등-rv5n77d3nzm4"
    verified: true

    verified_by: user
    verified_at: '2026-10-13T15:12:57+09:00'
  - id: composite_panel_core_nonflammable_2022
    rule_refs: [FR01]
    title: "강판+심재 복합자재 마감 부분 불연·준불연 의무 및 창고 등 외벽 불연·준불연"
    law: "건축물의 피난·방화구조 등의 기준에 관한 규칙(국토교통부령 제884호, 2021-09-03 공포) 제24조제1항제2호, 제3항, 제6항~제11항"
    effective_date: "2022-02-11"
    effective_date_basis: "부칙 '이 규칙은 2022년 2월 11일부터 시행한다'"
    applies_to: "부칙 제2조: 시행 이후 건축허가(변경허가·변경신고 제외) 신청, 건축신고, 용도변경 신청분부터 적용. 기존 건축물 소급 없음"
    summary: "제24조제1항제2호 '강판과 심재(心材)로 이루어진 복합자재를 마감재료로 사용하는 부분'은 불연재료 또는 준불연재료 사용(개정 2021.9.3). 현행 제24조제6항: 영 제61조제2항 제1~3호·제5호(공장·창고시설 등) 건축물 외벽은 불연·준불연 마감(단열재 포함), 화재확산방지구조 시 난연재료 허용하되 '강판과 심재로 이루어진 복합자재가 아닌 것으로 한정'. → 이 시행일 이전 허가분은 EPS·우레탄 심재 샌드위치패널 사용 가능성이 있음."
    source_url: "https://www.law.go.kr/lumLsLinkPop.do?lspttninfSeq=105201&chrClsCd=010202 ; https://www.nepla.ai/law/건축물의 피난·방화구조 등의 기준에 관한 규칙"
    verified: true

    verified_by: user
    verified_at: '2026-10-13T15:12:57+09:00'
